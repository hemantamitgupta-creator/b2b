<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#F0FDFA"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#006061" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Surgical Instrument Icon Outline -->
  <g transform="translate(236, 115)" stroke="#006061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Scissor rings -->
    <circle cx="28" cy="98" r="16" />
    <circle cx="100" cy="98" r="16" />
    <!-- Shanks crossing at pivot -->
    <path d="M40 86 L64 54" />
    <path d="M88 86 L64 54" />
    <!-- Pivot joint -->
    <circle cx="64" cy="54" r="3" fill="#006061" />
    <!-- Curved surgical blades -->
    <path d="M64 54 Q60 30 52 14" />
    <path d="M64 54 Q68 30 76 14" />
  </g>
  <text x="300" y="258" text-anchor="middle" fill="#006061" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">
    KRAFT SURGICALS
  </text>
  <text x="300" y="280" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
    ISO 13485:2016 Precision Surgical Instrument
  </text>
  <text x="300" y="300" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    AISI 420 Martensitic Medical Grade Alloy
  </text>
</svg>
